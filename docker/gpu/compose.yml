name: open-llama-gpu

x-logging: &log
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  lunch-gpu:
    image: open-llama:gpu-latest
    build:
      context: .
    container_name: open-llama-gpu
    network_mode: host
    runtime: nvidia
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: "${GPU_VISIBLE:-1}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      COIN: "${GPU_COIN:-}"
      POOL: "${POOL:-}"
      WORKER: "${WORKER:-}"
      POOL2: "${POOL2:-}"
      DEVICES: "${GPU_DEVICES:-}"
      API_PORT: ${GPU_API_PORT:-12001}
    logging: *log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:$${API_PORT}/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
